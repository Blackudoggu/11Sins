<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <!-- ----------------------------------------------------------------- -->
  <!-- About Your Site                                                   -->
  <!-- ----------------------------------------------------------------- -->
  <link rel="shortcut icon" type="image/png" href="assets/favicon.png" />
  <title>11Sins Store</title>
  <meta name="title" content="Sin Store" />
  <meta name="type" content="website" />
  <meta name="url" content="https://blackudoggu.github.io/11Sins/" />
  <meta name="image" content="assets/meta.png" />
  <meta name="description" content="A tool for organizing small ARPGs and species.">

  <!-- No AI scraping directives -->
  <meta name="robots" content="noai">
  <meta name="robots" content="noimageai">


  <!-- ----------------------------------------------------------------- -->
  <!-- Styles                                                            -->
  <!-- ----------------------------------------------------------------- -->

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
  
  <!-- Multiselect CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/css/bootstrap-select.min.css">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


  <!-- CSS -->
  <link rel="stylesheet" type="text/css" href="styles/css/charadex.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400|Comfortaa:500" rel="stylesheet">


</head>

<body id="charadex-body">


  <!-- --------------------------------------------------------------------
  <-- Header
  <-------------------------------------------------------------------- -->
  <div class="load-html" id="header" data-source="includes/header.html"></div>


  <!-- --------------------------------------------------------------------
  <-- Main
  <-------------------------------------------------------------------- -->
  <div class="container" id="main-container">
    <div class="card p-md-5 p-4">

      <h3 class="text-primary mb-0"><a href="store.html">Store</a></h3>
      <hr>

      <!-- Shown if nothing is for sale or the sheet can't be reached -->
      <p class="text-muted mb-0" id="store-empty" style="display:none;"></p>

      <!-- Store Gallery -->
      <div id="store-gallery" class="softload">
        <div id="store-group"></div>
      </div>

    </div>
  </div>


  <!-- --------------------------------------------------------------------
  <-- Footer
  <-------------------------------------------------------------------- -->
  <div class="load-html" id="footer" data-source="includes/footer.html"></div>


  <!-- --------------------------------------------------------------------
  <-- Repeat Items
  <-- Do not remove 'display:none;'
  <-------------------------------------------------------------------- -->
  <div style="display:none;">

    <!-- Category (one per item Type) -->
    <div class="mt-4 store-list-container" id="store-group-list">
      <h4 class="text-primary store-group-title"></h4>
      <div class="row no-gutters m-n2 store-list charadex-gallery-row"></div>
    </div>

    <!-- Store Item -->
    <div class="col-lg-3 col-sm-6 p-2" id="store-gallery-item">
      <div class="card bg-faded h-100">

        <!-- Name -->
        <div class="card-header bg-faded text-center">
          <h6 class="mb-0 text-primary">
            <a class="profileid profilelink" href=""></a>
          </h6>
        </div>

        <!-- Image -->
        <div class="card-body d-flex flex-fill store-card-body">
          <img class="img-fluid m-auto image store-image" src="">
        </div>

        <!-- Price -->
        <div class="card-footer bg-faded text-center py-2">
          <img class="priceimage" src="" alt="">
          <span class="price"></span>
        </div>

      </div>
    </div>

  </div>

  <!-- ----------------------------------------------------------------- -->
  <!-- JS                                                                -->
  <!-- ----------------------------------------------------------------- -->

<!-- JQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.js" integrity="sha256-H+K7U5CnXl1h5ywQfKtSj8PCmoN9aaq30gDh27Xc0jk=" crossorigin="anonymous"></script>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>
  
  <!-- Bootstrap Multiselect -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/bootstrap-select.min.js"></script>

  <!-- Charadex Script -->
  <script src="styles/js/pages/base.js" type="module"></script>
  <script src="styles/js/pages/store.js" type="module"></script>


</body>

</html>
